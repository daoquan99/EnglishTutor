services:
  postgres:
    image: postgres:17-alpine
    container_name: englishtutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: englishtutor
      POSTGRES_PASSWORD: englishtutor_dev
      POSTGRES_DB: english_tutor_db
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englishtutor -d english_tutor_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: englishtutor-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: englishtutor
      RABBITMQ_DEFAULT_PASS: englishtutor_dev
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: englishtutor-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional - uncomment to enable centralized structured log viewing.
  # seq:
  #   image: datalust/seq:latest
  #   container_name: englishtutor-seq
  #   restart: unless-stopped
  #   environment:
  #     ACCEPT_EULA: "Y"
  #   ports:
  #     - "${SEQ_INGESTION_HOST_PORT:-5341}:5341"
  #     - "${SEQ_WEB_HOST_PORT:-8081}:80"

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
